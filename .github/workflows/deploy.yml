name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # النشر المجدول: بناء يومي 6:00 صباحًا بتوقيت الكويت يُظهر المنتجات التي حان publishDate لها
  schedule:
    - cron: "11 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: ذاكرة الصور المحسّنة
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.sha }}
          restore-keys: astro-assets-
      - name: Build
        run: npm run build
      # فحص الجوال: يمنع النشر إذا صارت أي صفحة أعرض من الشاشة أو خرج زر واتساب العائم عنها
      - name: تثبيت متصفح فحص الجوال
        run: npx playwright install --with-deps --only-shell chromium
      - name: فحص الجوال
        run: npm run check:mobile
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub يوقف الجداول تلقائيًا بعد 60 يومًا بلا commits؛ إعادة التفعيل عبر الـAPI تُبقي البناء اليومي يعمل
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: إبقاء الجدول اليومي فعّالًا
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
